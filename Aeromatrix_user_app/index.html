<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/aeromatrix-mark.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="color-scheme" content="light dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="AeroMatrix" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <title>AeroMatrix For Users</title>
    <style>
      /* Shown until the app has loaded, so a phone never starts on a blank page. */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #eaf3ff; color: #14295a; font: 600 15px 'Inter Variable', system-ui, sans-serif; }
            @keyframes boot-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.94); opacity: 0.75; } }
      @media (prefers-reduced-motion: reduce) { #boot img { animation: none !important; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot" role="status" aria-live="polite">
        <img src="/aeromatrix-logo.png" width="72" height="72" alt="" style="animation: boot-pulse 1.6s ease-in-out infinite" />
        <span>AeroMatrix</span>
        <noscript>This app needs JavaScript.</noscript>
      </div>
    </div>
    <script>
      // Match the splash to a saved or system theme before the app starts.
      try {
        var s = JSON.parse(localStorage.getItem('aeromatrix.user.settings.v1') || '{}');
        var t = s.theme;
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var b = document.getElementById('boot');
        if (dark && b) { b.style.background = '#06122b'; b.style.color = '#e1eaff'; }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
